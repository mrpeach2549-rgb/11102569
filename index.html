<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERPEACH</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:#080808;color:#fff;min-height:100vh;overflow-x:hidden;
  }
  .bg{
    position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(circle at 20% 20%,rgba(255,255,255,.10),transparent 25%),
      radial-gradient(circle at 80% 70%,rgba(255,255,255,.06),transparent 28%),
      #080808;
  }
  .grain{position:fixed;inset:0;pointer-events:none;opacity:.06;z-index:10;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
  }
  .screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{
    width:min(720px,100%);text-align:center;padding:56px 28px;margin:0 auto;
    border:1px solid rgba(255,255,255,.14);border-radius:28px;
    background:rgba(255,255,255,.045);backdrop-filter:blur(18px);
    box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
  .small{font-size:13px;letter-spacing:4px;text-transform:uppercase;color:#aaa;margin-bottom:20px}
  h1{font-size:clamp(38px,8vw,72px);line-height:1.02;letter-spacing:-3px;margin-bottom:20px}
  p{color:#aaa;line-height:1.8}
  button{
    margin-top:32px;border:0;border-radius:999px;padding:15px 28px;
    background:#fff;color:#090909;font-size:15px;font-weight:700;cursor:pointer;
    transition:.25s;box-shadow:0 10px 30px rgba(255,255,255,.12)
  }
  button:hover{transform:translateY(-3px);box-shadow:0 15px 35px rgba(255,255,255,.2)}
  .hidden{display:none}
  .content{width:min(900px,100%);padding:70px 20px;margin:0 auto}
  .reveal{animation:up .9s ease both}
  @keyframes up{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}
  .hero{text-align:center;margin-bottom:70px}
  .hero h2{font-size:clamp(40px,8vw,80px);letter-spacing:-4px;margin-bottom:15px}
  .line{width:60px;height:2px;background:#fff;margin:25px auto}
  .message{
    max-width:650px;margin:0 auto 60px;text-align:center;
    font-size:18px;color:#ddd;line-height:2;
  }
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:35px 0 70px}
  .photo{
    aspect-ratio:1/1.15;border-radius:18px;overflow:hidden;
    background:linear-gradient(145deg,#222,#111);border:1px solid #292929;
    display:flex;align-items:center;justify-content:center;color:#666;font-size:14px;
  }
  .photo:nth-child(2){transform:translateY(22px)}
  .photo span{padding:20px}
  .timeline{max-width:650px;margin:auto;border-left:1px solid #333;padding-left:25px}
  .item{margin-bottom:35px;position:relative}
  .item:before{content:"";position:absolute;left:-31px;top:7px;width:11px;height:11px;border-radius:50%;background:#fff}
  .date{font-size:12px;color:#777;letter-spacing:2px;margin-bottom:7px}
  .item h3{margin-bottom:7px}
  .item p{font-size:14px}
  .ending{text-align:center;margin-top:80px;padding:55px 20px;border-top:1px solid #222}
  .ending h2{font-size:clamp(30px,6vw,52px);margin-bottom:15px}
  .heart{font-size:28px;animation:pulse 1.5s infinite}
  @keyframes pulse{50%{transform:scale(1.18)}}
  .float{position:fixed;bottom:-30px;font-size:18px;opacity:0;animation:float 5s linear forwards;pointer-events:none}
  @keyframes float{0%{opacity:0;transform:translateY(0) rotate(0)}15%{opacity:.7}100%{opacity:0;transform:translateY(-110vh) rotate(35deg)}}
  @media(max-width:650px){.photos{grid-template-columns:1fr 1fr}.photo:nth-child(2){transform:none}.photo:last-child{display:none}}
</style>
</head>
<body>
<div class="bg"></div><div class="grain"></div>

<section id="intro" class="screen">
  <div class="card reveal">
    <div class="small">PREVIEW</div>
    <h1>PERPEACH</h1>
    <p>PEERAPAT RUKTHAINIYOM<br>11/10/69</p>
    <button onclick="openSurprise()">CLICK HERE</button>
  </div>
</section>

<main id="main" class="hidden">
  <div class="content">
    <section class="hero reveal">
      <div class="small">for someone special</div>
      <h2>Answer</h2>
      <div class="line"></div>
    </section>

    <section class="message reveal">
      <p>
      </p>
    </section>

    <section class="photos reveal">
      <img src="images/IMG_4016.PNG" alt="Trulli" width="800" height="333">
    </section>

    <section class="timeline reveal">
      <div class="item">
        <div class="date">PERPEACH</div>
        <h3>เลือกหัวข้อ แฟน</h3>
      </div>
    </section>

    <section class="ending reveal">
      <div class="heart">♡</div>
      <h2>หากยอมรับคำตอบกดใจข้อความนี้ในแชท</h2>
    </section>
  </div>
</main>

<script>
function openSurprise(){
  document.getElementById('intro').style.display='none';
  document.getElementById('main').classList.remove('hidden');
  for(let i=0;i<16;i++){
    setTimeout(()=>{
      const el=document.createElement('div');
      el.className='float';
      el.textContent=Math.random()>.5?'♡':'✦';
      el.style.left=Math.random()*100+'vw';
      el.style.animationDelay=(Math.random()*.8)+'s';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),6000);
    },i*90);
  }
}
</script>
</body>
</html>
